[package]
name = "mydesk-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mydesk"
path = "src/main.rs"

# `mobius` is the product-facing spelling. Keep `mydesk` for existing local
# scripts while both entry points intentionally expose the same commands.
[[bin]]
name = "mobius"
path = "src/mobius.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
mydesk-core = { path = "../mydesk-core" }
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing-subscriber.workspace = true
