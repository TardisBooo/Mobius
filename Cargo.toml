[workspace]
members = [
  "crates/mydesk-core",
  "crates/mydesk-daemon",
  "crates/mydesk-cli",
  "crates/mydesk-mcp",
  "apps/desktop/src-tauri",
]
resolver = "3"

[workspace.package]
version = "0.3.9"
edition = "2024"
license = "MIT"
authors = ["MyDesk"]

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
csv = "1.3"
hex = "0.4"
parking_lot = "0.12"
portable-pty = "0.9"
ratatui = "0.30"
regex = "1.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "gzip", "brotli", "deflate"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono", "serde_json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "io-util", "signal", "sync", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
url = "2.5"
walkdir = "2.5"
